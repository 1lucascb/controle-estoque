<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alterar senha | Controle de Estoque</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body data-page="change-password">
    <div class="app-shell">
        {% include 'sidebar.html' %}
        <main class="main-content">
            <header class="topbar">
                <div>
                    <div class="eyebrow">Seguranca</div>
                    <h1>Alterar senha</h1>
                    <p class="subtitle">Mantenha sua conta protegida com uma senha exclusiva.</p>
                </div>
            </header>
            <section class="panel" style="max-width: 640px;">
                <div class="panel-header">
                    <div>
                        <h2>Nova senha</h2>
                        <p class="subtitle">Use pelo menos 8 caracteres.</p>
                    </div>
                    <i data-lucide="shield-check" aria-hidden="true"></i>
                </div>
                <form id="change-password-form">
                    <div class="form-group">
                        <label for="current-password">Senha atual</label>
                        <input id="current-password" name="current_password" type="password" required minlength="1"
                            autocomplete="current-password">
                    </div>
                    <div class="form-group">
                        <label for="new-password">Nova senha</label>
                        <input id="new-password" name="new_password" type="password" required minlength="8"
                            autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirmar nova senha</label>
                        <input id="confirm-password" name="confirm_password" type="password" required minlength="8"
                            autocomplete="new-password">
                    </div>
                    <button class="btn btn-primary" type="submit">
                        <i data-lucide="save"></i> Salvar nova senha
                    </button>
                </form>
            </section>
        </main>
    </div>
    <div id="toast" class="toast"></div>
    <script type="module" src="/static/js/app.js"></script>
</body>

</html>
